services:
  - type: web
    name: graphql-event-booking-api
    env: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        sync: false
      - key: FRONTEND_URL
        value: # https://your-app.vercel.app
